<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32">
  <!-- The brand mark: a wood shaving (viruta) leaving the plane and curling up. A ribbon in token "tape" outlined in the light theme's "ink", so it shows on light and dark tab bars. -->
  <!-- After changing it, regenerate the other icons from it:
       rsvg-convert -w 32 -h 32 favicon.svg | magick - favicon.ico
       rsvg-convert -w 140 -h 140 favicon.svg | magick -size 180x180 'xc:#f7f1e8' - -gravity center -composite -alpha off -depth 8 -strip apple-touch-icon.png -->
  <defs>
    <path id="shaving" d="M4.25 25H17.75A10 10 0 0 0 17.75 5A6.5 6.5 0 0 0 11.25 11.5A4.5 4.5 0 0 0 15.75 16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>
  <use href="#shaving" xlink:href="#shaving" stroke="#2a2017" stroke-width="7"/>
  <use href="#shaving" xlink:href="#shaving" stroke="#f5b700" stroke-width="3.5"/>
</svg>

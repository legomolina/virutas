# Runs Claude when the owner mentions @claude in an issue, a PR comment or a
# review: it can answer, review again, or implement an issue and open a PR.
# claude-ready.yml also starts it (workflow_dispatch) to implement an issue
# that just became ready-for-agent, with no comment needed.
# It works like a local session: the project's CLAUDE.md, hooks and checks
# apply, so dependencies are installed first for the hooks and checks to run.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the issue to implement
        required: true
        type: number

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  claude:
    # Only the owner can trigger it: the repo is public, and every run spends
    # the owner's Claude subscription. A dispatch needs write access, which
    # only the owner has; claude-ready.yml dispatches only for issues the owner
    # marked ready-for-agent.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on PRs

    steps:
      # No persisted GITHUB_TOKEN (read-only): checkout v7 keeps it in an
      # includeIf'd file the action cannot remove, so git would push with it
      # (403) instead of the Claude GitHub App token the action sets up.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # An issue's model label (docs/agents/triage-labels.md) picks the model:
      # the dispatched issue's, or the labels of the issue or PR the event is
      # on. Without one (PR reviews have no labels here, and a PR carries its
      # own labels, not its issue's) the action's default model runs.
      - name: Choose the model
        id: model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          EVENT_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          if [ -n "$ISSUE" ]; then
            labels=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')
          else
            labels=$EVENT_LABELS
          fi
          args=''
          if jq -e 'index("model:opus")' <<< "$labels" > /dev/null; then
            args='--model opus'
          elif jq -e 'index("model:sonnet")' <<< "$labels" > /dev/null; then
            args='--model sonnet'
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A dispatch from claude-ready.yml runs as github-actions[bot],
          # which the action refuses unless it is listed here.
          allowed_bots: 'github-actions'
          # Claude's closing report on the run's Summary page, for dispatched
          # runs only: they start only on issues the owner marked
          # ready-for-agent, so the report comes from input the owner chose.
          display_report: ${{ github.event_name == 'workflow_dispatch' }}
          # A dispatched run has no comment to answer, so it gets the request
          # here, and reports on the issue because nobody is watching it.
          # A block scalar, not a plain one: there, the ' #' of 'issue #{0}'
          # would start a YAML comment and cut the expression short.
          prompt: >-
            ${{ github.event_name == 'workflow_dispatch' && format('Implement issue #{0} of this repository. Nobody is watching this run, so when you finish, post the summary that docs/agents/implement-issue.md ends with, including the Create PR link, as a comment on the issue (gh issue comment {0}). If you stop early, because the issue is blocked or leaves a decision only the owner can make, say why in that comment and remove its in-progress label (gh issue edit {0} --remove-label in-progress).', inputs.issue) || '' }}
          # The plugin .claude/settings.json enables locally, so CLAUDE.md's
          # skills (tdd, code-review, diagnosing-bugs, pr…) load in CI too.
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'mattpocock-skills@claude-plugins-official'
          additional_permissions: |
            actions: read
          # The standing steps for implementing an issue live in a reviewed
          # file, so a comment can be as short as "implement this issue".
          # Allowed tools: editing files (a comment-started run gets it from
          # the action, a dispatched one only from this list, so without it a
          # dispatched run could not write a file), the commands the project
          # allows locally
          # (.claude/settings.json), plus mutation testing, and git and gh to
          # branch, commit and push. gh pr is limited to the subcommands the
          # agent needs and merging is denied: only the owner merges. The
          # Guardrails check (guardrails.yml) fails any change of the agent's
          # to a guardrail path until the owner approves it, and ignores an
          # approval label the agent adds itself.
          claude_args: >-
            ${{ steps.model.outputs.args }}
            --append-system-prompt "When asked to implement an issue, follow docs/agents/implement-issue.md, taking its On GitHub branch at each step. Never merge a pull request: the owner merges. Never change a guardrail path listed in scripts/check-guardrail-paths.mjs unless the owner's request asks for that change."
            --allowedTools
            "Edit" "Write" "MultiEdit"
            "Bash(pnpm lint)" "Bash(pnpm lint:fix)" "Bash(pnpm typecheck)"
            "Bash(pnpm test:ci)" "Bash(pnpm test:ci *)" "Bash(pnpm build)"
            "Bash(pnpm i18n:check)" "Bash(pnpm exec ng test *)" "Bash(pnpm mutation)"
            "Bash(git *)" "Bash(gh issue *)" "Bash(gh run *)"
            "Bash(gh pr create *)" "Bash(gh pr view)" "Bash(gh pr view *)"
            "Bash(gh pr diff *)" "Bash(gh pr checks *)" "Bash(gh pr comment *)"
            "Bash(gh pr edit *)" "Bash(gh pr list *)"
            --disallowedTools "Bash(gh pr merge *)"

  # A dispatched run says on its issue that it started, with the model and a
  # link to follow it, since nobody asked for it in a comment. It names the
  # model the way "Choose the model" picks it (Opus first).
  announce:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          model=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq '[.labels[].name] | if index("model:opus") then "Opus" elif index("model:sonnet") then "Sonnet" else "the default model" end')
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Claude started implementing this issue with $model. Follow it here: $RUN_URL"

  # A dispatched run that fails says so on its issue and frees it, so the owner
  # sees it and can start it again (remove and re-add ready-for-agent).
  report-failure:
    needs: claude
    if: failure() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "The agent could not finish this issue: $RUN_URL. To start it again, remove and re-add ready-for-agent."
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label in-progress

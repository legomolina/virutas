# Fails a PR that someone other than the owner opened (an outside contributor
# or the @claude agent) when it changes a guardrail: workflows, agent
# configuration and instructions, checks, and lint, test and build config
# (the list is in scripts/check-guardrail-paths.mjs). The owner approves such
# a change with the "guardrails-approved" label. The ruleset on main requires
# this check.
#
# pull_request_target, not pull_request: it runs this workflow and the script
# as they are on main, so a PR cannot edit them to pass. It is safe because
# the PR's code is never checked out or run: the changed paths come from the
# API.
name: Guardrails

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  guardrail-paths:
    name: Guardrail paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The base branch (the default for pull_request_target), never the PR.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check the changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'guardrails-approved') }}
        # Renames list the old path too, so moving a guardrail away counts.
        # An explicit bash shell runs with pipefail, so a failed API call
        # fails the check instead of passing an empty list.
        shell: bash
        run: >-
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files"
          --jq '.[] | .filename, (.previous_filename // empty)'
          | node scripts/check-guardrail-paths.mjs

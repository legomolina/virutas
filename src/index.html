<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Virutas</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      For link previews that do not run JavaScript, which see this file on every page. The app
      (providePageMeta) then sets each page's description, og:title, og:description, og:url and
      canonical link; the canonical link and og:url are left out here, so no page ever starts
      out pointing at another.
    -->
    <meta
      name="description"
      content="Woodworking calculators that run in your browser: convert measurements, set the Fence for a Bevel Cut and plan your Cuts with the least Waste."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Virutas" />
    <meta property="og:title" content="Virutas" />
    <meta
      property="og:description"
      content="Woodworking calculators that run in your browser: convert measurements, set the Fence for a Bevel Cut and plan your Cuts with the least Waste."
    />
    <meta property="og:image" content="https://virutas.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Virutas wood shaving mark, with the words: Virutas, woodworking calculators that run in your browser."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Body text font, so the first paint uses it. Same URL as in src/styles/fonts.css. -->
    <link
      rel="preload"
      href="/fonts/barlow/barlow-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <wt-root></wt-root>
  </body>
</html>

@let text = labels();
<ul>
  <li><span data-kind="part">1</span> {{ text.part }}</li>
  <li><span data-kind="kerf"></span> {{ text.kerf }}</li>
  <li>
    <span data-kind="trim"><wt-hatch pattern="single" /></span> {{ text.trim }}
  </li>
  <li><span data-kind="offcut"></span> {{ text.offcut }}</li>
  <li>
    <span data-kind="waste"><wt-hatch pattern="cross" /></span> {{ text.waste }}
  </li>
</ul>
